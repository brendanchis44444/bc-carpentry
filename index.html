<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#33572C">
<meta name="description" content="Quotes, jobs, day logs, invoices and tax for a trade business">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>
<title>BC Carpentry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: side rail on wide screens, top bar + thumb-reach bottom tabs on phones. Green for the brand, orange for money/attention. */
:root{
  --bg:#F1F3EC; --surface:#FFFFFF; --surface2:#E7EBE0; --ink:#1D271B; --muted:#5C6857; --line:#D3DACB;
  --brand:#33572C; --brand-ink:#2E5127; --on-brand:#FFFFFF; --brand-soft:#DDE7D7;
  --orange:#B8661F; --orange-soft:#F6E4D2;
  --good:#2D7A45; --good-soft:#D9EEDF; --warn:#9A6411; --warn-soft:#F7E9C9; --bad:#AE3A2C; --bad-soft:#F6DCD7;
  --blue:#2F5F8A; --blue-soft:#DCE7F1; --plum:#71467F; --plum-soft:#ECDDF0; --grey-soft:#E6E7E3;
  --shadow:0 1px 2px rgba(30,40,25,.06),0 4px 14px rgba(30,40,25,.06);
  --f-display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121711; --surface:#1A2219; --surface2:#232D21; --ink:#E5ECE1; --muted:#9BA996; --line:#313D2E;
  --brand:#3F6E36; --brand-ink:#8FC283; --on-brand:#FFFFFF; --brand-soft:#243522;
  --orange:#E19352; --orange-soft:#3A2919;
  --good:#6CC287; --good-soft:#1C3324; --warn:#E2B254; --warn-soft:#382D16; --bad:#EE8576; --bad-soft:#3D1F1B;
  --blue:#8DB6DD; --blue-soft:#1C2B39; --plum:#C9A2D6; --plum-soft:#2E2234; --grey-soft:#2A3128;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121711; --surface:#1A2219; --surface2:#232D21; --ink:#E5ECE1; --muted:#9BA996; --line:#313D2E;
  --brand:#3F6E36; --brand-ink:#8FC283; --on-brand:#FFFFFF; --brand-soft:#243522;
  --orange:#E19352; --orange-soft:#3A2919;
  --good:#6CC287; --good-soft:#1C3324; --warn:#E2B254; --warn-soft:#382D16; --bad:#EE8576; --bad-soft:#3D1F1B;
  --blue:#8DB6DD; --blue-soft:#1C2B39; --plum:#C9A2D6; --plum-soft:#2E2234; --grey-soft:#2A3128;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1rem} h4{font-size:.9rem}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.money{font-variant-numeric:tabular-nums}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.mark{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;border-radius:9px;background:rgba(255,255,255,.16);color:#fff}.mark svg{width:20px;height:20px}
.top h1{font-size:1.05rem;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .iconbtn{background:transparent;border:0;color:var(--on-brand);width:40px;height:40px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.top .iconbtn:hover{background:rgba(255,255,255,.12)}
.sync{font-size:.75rem;opacity:.85;white-space:nowrap}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:1100px;width:100%;margin:0 auto;min-width:0}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.bottom button,.side button.nav{background:none;border:0;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;font-size:.72rem;font-weight:600}
.bottom button svg{width:22px;height:22px}
.bottom button.on{color:var(--brand-ink)}
.bottom button.on svg{stroke-width:2.3}
@media (min-width:900px){
  .shell{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;background:var(--brand);color:var(--on-brand);padding:20px 14px;position:sticky;top:0;height:100vh}
  .side .brandrow{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
  .side .brandrow .mark{width:36px;height:36px}
  .side .brandrow b{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.1}
  .side .brandrow small{display:block;opacity:.75;font-size:.75rem;font-weight:400}
  .side button.nav{flex-direction:row;gap:12px;color:rgba(255,255,255,.82);font-size:.95rem;font-weight:500;padding:10px 12px;justify-content:flex-start}
  .side button.nav svg{width:20px;height:20px}
  .side button.nav:hover{background:rgba(255,255,255,.08)}
  .side button.nav.on{background:rgba(255,255,255,.16);color:#fff}
  .side .spacer{flex:1}
  .side .sync{padding:8px 12px}
  .bottom{display:none}
  .top .mark,.top .sync{display:none}
  main{padding:24px 32px 48px}
}

/* building blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card h2{margin-bottom:10px}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card .head h2,.card .head h3{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.label{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:600;font-size:.92rem;cursor:pointer;min-height:40px;text-decoration:none;white-space:nowrap;max-width:100%}
@media (max-width:420px){.btn{white-space:normal;text-align:center}}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-ink)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.84rem}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:default}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--surface2);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;font-size:16px}
textarea{min-height:72px;resize:vertical}
textarea.auto{min-height:34px;resize:none;overflow:hidden;line-height:1.35;field-sizing:content}
.line{align-items:start!important}.line .x,.line .done,.line .tbc{margin-top:4px}
@media (max-width:480px){.top .sync{display:none}}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-ink);outline-offset:-1px;border-color:transparent}
input.bare,textarea.bare{border-color:transparent;background:transparent;padding:4px 6px;min-height:34px}
input.bare:hover,textarea.bare:hover{border-color:var(--line)}
input.n{text-align:right}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:700;white-space:nowrap;background:var(--grey-soft);color:var(--muted)}
.pill.lead{background:var(--blue-soft);color:var(--blue)}
.pill.quoted{background:var(--orange-soft);color:var(--orange)}
.pill.won{background:var(--brand-soft);color:var(--brand-ink)}
.pill.active{background:var(--good-soft);color:var(--good)}
.pill.done{background:var(--plum-soft);color:var(--plum)}
.pill.paid{background:var(--grey-soft);color:var(--muted)}
.pill.lost{background:var(--bad-soft);color:var(--bad)}
.pill.sent{background:var(--orange-soft);color:var(--orange)}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.draft{background:var(--grey-soft);color:var(--muted)}
.pill.paidinv{background:var(--good-soft);color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:0 -4px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand-ink);border-bottom-color:var(--orange)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.item:first-child{border-top:0}
.item:hover{background:var(--surface2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:.8rem;color:var(--muted);font-weight:600}
.stat .sub{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-width:0}
.tile.accent{border-color:var(--orange);background:var(--orange-soft)}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand-ink);border-radius:99px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.note{border-left:3px solid var(--orange);background:var(--orange-soft);padding:10px 12px;border-radius:6px;font-size:.9rem}
.note.info{border-color:var(--brand-ink);background:var(--brand-soft)}
.tablewrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.total td{font-weight:700;border-bottom:0}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* sections / estimator */
.section{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.section>.sh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);flex-wrap:wrap}
.section>.sh input.title{font-family:var(--f-display);font-weight:600;font-size:1rem;flex:1;min-width:160px}
.section .sb{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:28px minmax(0,1fr) 78px 32px;gap:6px;align-items:center}
.line.mat{grid-template-columns:minmax(0,1fr) 62px 96px 54px 32px}
.line.head{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.line .tbc{font-size:.75rem;display:flex;gap:4px;align-items:center;justify-content:center;color:var(--muted)}
.line .tbc input{width:16px;height:16px;accent-color:var(--orange)}
.line .done input{width:20px;height:20px;accent-color:var(--brand)}
.line.isdone .bare{text-decoration:line-through;color:var(--muted)}
.sectotal{display:flex;justify-content:flex-end;gap:16px;font-size:.88rem;color:var(--muted);padding-top:4px;flex-wrap:wrap}
.sectotal b{color:var(--ink)}
@media (max-width:520px){
  .line.mat{grid-template-columns:62px 92px 1fr 32px;row-gap:4px}
  .line.mat > :first-child{grid-column:1/-1}
  .line.mat .tbc{justify-content:flex-start}
}
.subhead{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface2);text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
.cal .d{background:var(--surface);min-height:74px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;text-align:left;font:inherit;color:inherit}
.cal .d.out{background:var(--bg);color:var(--muted)}
.cal .d .dn{font-size:.8rem;font-weight:700;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .d.today .dn{background:var(--orange);color:#fff}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--brand-ink)}
.cal .ev{font-size:.7rem;line-height:1.25;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal .more{font-size:.68rem;color:var(--muted)}
.cal .logdot{font-size:.66rem;color:var(--good);font-weight:700}
@media (max-width:600px){.cal .d{min-height:56px}.cal .ev{font-size:0;height:6px;padding:0}.cal .logdot{font-size:0}.cal .logdot::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--good)}}
.t-work{background:var(--brand-soft);color:var(--brand-ink)}
.t-quote{background:var(--orange-soft);color:var(--orange)}
.t-delivery{background:var(--blue-soft);color:var(--blue)}
.t-admin{background:var(--grey-soft);color:var(--muted)}
.t-personal{background:var(--plum-soft);color:var(--plum)}
.evrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0}
.evrow .time{width:68px;flex:none;font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.evrow .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* log */
.entry{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.times{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hoursbadge{font-family:var(--f-display);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week button{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 2px;text-align:center;cursor:pointer;font:inherit;color:inherit;min-width:0}
.week button.on{border-color:var(--brand-ink);box-shadow:inset 0 0 0 1px var(--brand-ink)}
.week .wd{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.week .wh{font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}

/* modal / toast */
.modalbg{position:fixed;inset:0;background:rgba(10,15,8,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.modalbg{align-items:center;padding:24px}.modal{border-radius:14px;padding:22px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}

/* document preview (paper is deliberately always light) */
.paperwrap{overflow-x:auto;background:var(--surface2);border-radius:var(--r);padding:12px;border:1px solid var(--line)}
.paperscale{transform-origin:top left}
.paper{width:794px;background:#fff;color:#1d2a1b;font-family:"Poppins",sans-serif;font-size:12.5px;line-height:1.5;padding:50px 56px 40px;position:relative}
.paper *{color:inherit}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.matpick{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:260px;overflow-y:auto}.mp{display:flex;gap:10px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}.mp:first-child{border-top:0}.mp input{width:20px;height:20px;flex:none}.mp.done{opacity:.6}
.modal details summary{cursor:pointer;padding:4px 0;color:var(--muted)}.modal details textarea{margin-top:6px;width:100%}
.tripkm{align-items:flex-end;gap:10px}.tripkm .field{width:130px}.tripkm .check{padding-bottom:9px}
.jno{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.logoprev{min-width:110px;min-height:44px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:10px;padding:6px}.logoprev img{max-width:140px;max-height:60px}
.paper .ph img{width:92px;height:auto}.paper .ph .wordmark{font-size:22px;font-weight:700;color:var(--brand-ink,#33572C);max-width:300px;line-height:1.15}
.paper .ttl{text-align:right}
.paper .ttl h1{font-family:"Poppins",sans-serif;font-size:46px;font-weight:700;letter-spacing:.02em;color:#33572C;line-height:1;margin:0 0 10px}

  if (Store.mode === "loading" && !Object.keys(Store.docs).length) { $("#main").innerHTML = `<div class="empty">Loading your jobs…</div>`; drawChrome(); return; }
  S();
  // keep focus + caret through re-render
  const a = document.activeElement; let keep = null;
  if (a && a.dataset && (a.dataset.k || a.id) && $("#main").contains(a)) keep = { k:a.dataset.k, id:a.id, s:a.selectionStart, e:a.selectionEnd };
  drawChrome();
  const V = VIEWS[UI.view] || VIEWS.home;
  const html = V();
  if (RENDERING) return;
  RENDERING = true; try { $("#main").innerHTML = html; } finally { RENDERING = false; }
  hydrateImgs($("#main"));
  document.querySelectorAll("textarea.auto").forEach(autosize);
  fitPaper();
  if (keep) { const el = keep.k ? document.querySelector(`[data-k="${CSS.escape(keep.k)}"]`) : document.getElementById(keep.id); if (el) { el.focus({preventScroll:true}); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch(e){} } }
  syncHist();
}
function drawChrome(){
  const cur = navOf(UI.view);
  const navBtns = (cls) => NAV.map(([v, l, i]) => `<button class="${cls} ${cur === v ? "on" : ""}" data-act="nav" data-v="${v}" aria-current="${cur === v ? "page" : "false"}">${ic(i)}<span>${l}</span></button>`).join("");
  $("#side").innerHTML = `<div class="brandrow">${markHtml()}<b>${esc(bizName())}<small>${esc(S().trading ? S().name : "")}</small></b></div>${navBtns("nav")}<div class="spacer"></div><button class="nav ${cur === "settings" ? "on" : ""}" data-act="nav" data-v="settings">${ic("gear")}<span>Settings</span></button><div class="sync tiny">${syncText()}</div>`;
  $("#bottom").innerHTML = navBtns("");
  const top = NAV.some(n => n[0] === UI.view) || UI.view === "settings";
  $("#top").innerHTML = `${top ? `${markHtml()}` : `<button class="iconbtn" data-act="back" aria-label="Back">${ic("back")}</button>`}<h1>${esc(title())}</h1><span class="sync">${syncText()}</span>${UI.view !== "settings" ? `<button class="iconbtn" data-act="nav" data-v="settings" aria-label="Settings">${ic("gear")}</button>` : ""}`;
}
function autosize(t){ t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }
document.addEventListener("input", e => { if (e.target.classList && e.target.classList.contains("auto")) autosize(e.target); });
window.addEventListener("resize", () => document.querySelectorAll("textarea.auto").forEach(autosize));
function fitPaper(){
  document.querySelectorAll(".paperwrap").forEach(w => { const p = w.querySelector(".paper"), sc = w.querySelector(".paperscale"); if (!p || !sc) return; const avail = w.clientWidth - 24; const f = Math.min(1, avail / 794); sc.style.transform = `scale(${f})`; sc.style.width = "794px"; sc.style.height = (p.offsetHeight * f) + "px"; });
}
window.addEventListener("resize", () => fitPaper());

function jobPlan(j){
  const q = quoteCalc(j), s = S(), ef = estimateFactor();
  const K = p => `data-k="${j.id}|${p}"`;
  const secs = (j.sections || []).map((sec, si) => {
    const c = q.secs[si];
    const tasks = (sec.tasks || []).map((t, ti) => `<div class="line ${t.done ? "isdone" : ""}"><label class="done" title="Done"><input type="checkbox" ${K(`sections.${si}.tasks.${ti}.done`)} ${t.done ? "checked" : ""} aria-label="Done"></label><textarea class="bare auto" rows="1" ${K(`sections.${si}.tasks.${ti}.text`)} placeholder="Task">${esc(t.text)}</textarea><input class="n" type="number" step="0.25" inputmode="decimal" ${K(`sections.${si}.tasks.${ti}.hours`)} value="${t.hours ?? ""}" placeholder="hrs" aria-label="Hours"><button class="x" data-act="rmrow" data-id="${j.id}" data-p="sections.${si}.tasks" data-i="${ti}" aria-label="Remove task">${ic("x")}</button></div>`).join("");
    const mats = (sec.mats || []).map((m, mi) => `<div class="line mat"><textarea class="bare auto" rows="1" data-sug="mat" ${K(`sections.${si}.mats.${mi}.text`)} placeholder="Material or cost">${esc(m.text)}</textarea><input class="n" type="number" step="any" inputmode="decimal" ${K(`sections.${si}.mats.${mi}.qty`)} value="${m.qty ?? 1}" aria-label="Quantity"><input class="n" type="number" step="any" inputmode="decimal" ${K(`sections.${si}.mats.${mi}.cost`)} value="${m.cost ?? ""}" placeholder="$ each" aria-label="Cost each"><label class="tbc"><input type="checkbox" ${K(`sections.${si}.mats.${mi}.tbc`)} ${m.tbc ? "checked" : ""}>TBC</label><button class="x" data-act="rmrow" data-id="${j.id}" data-p="sections.${si}.mats" data-i="${mi}" aria-label="Remove material">${ic("x")}</button></div>`).join("");
    const doneN = (sec.tasks || []).filter(t => t.done).length;
    return `<div class="section"><div class="sh"><input class="bare title" type="text" ${K(`sections.${si}.name`)} value="${esc(sec.name)}" placeholder="Section name, e.g. Demo, Framing, Cladding"><span class="small muted">${doneN}/${(sec.tasks || []).length} done</span>
      <button class="x" data-act="mvsec" data-id="${j.id}" data-i="${si}" data-d="-1" aria-label="Move up">↑</button><button class="x" data-act="mvsec" data-id="${j.id}" data-i="${si}" data-d="1" aria-label="Move down">↓</button><button class="x" data-act="rmsec" data-id="${j.id}" data-i="${si}" aria-label="Delete section">${ic("x")}</button></div>
      <div class="sb">

const byDT = (a, b) => (a.date + (a.start || "")).localeCompare(b.date + (b.start || ""));
const eventsOn = d => all("event").filter(e => e.date === d || (e.end_date && e.date <= d && e.end_date >= d)).sort(byDT);
function evRow(e, showDate){

}
function weekStart(d){ const x = parseD(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return ymd(x); }
VIEWS.calendar = () => {
  const t = today(); if (!UI.calMonth) UI.calMonth = t.slice(0, 7);
  const [y, m] = UI.calMonth.split("-").map(Number);
  const first = ymd(new Date(y, m - 1, 1)); const start = weekStart(first);
  const cells = []; for (let i = 0; i < 42; i++) { const d = addDays(start, i); if (i >= 35 && d.slice(0, 7) !== UI.calMonth) break; cells.push(d); }
  const sel = UI.calSel;

/* driving: each work trip with where from, where to, why and the km, which is what the ATO wants to see */
const TRIP_WHY = ["Travel to site and back","Getting prices on materials","Picking up materials","Supplier run","Quote visit","Tip run","Bank, post office or accountant","Tool repairs or servicing"];
const shortAddr = a => String(a || "").split(",")[0];
function driveCard(log, K, id){
  const s = S(), trips = log.trips || [], total = dayKm(log);
  const sites = [...new Set((log.entries || []).map(e => (e.site || "").trim()).filter(x => x && x !== "Various"))].filter(x => !trips.some(t => normAddr(t.to) === normAddr(x))).slice(0, 3);
  const row = (t, i) => `<div class="entry trip">
    <div class="row between"><b class="small">Trip ${i + 1}</b><button class="x" data-act="rmrow" data-id="${id}" data-p="trips" data-i="${i}" aria-label="Remove trip">${ic("x")}</button></div>
    <div class="fields"><label class="field"><span>From</span><input type="text" data-sug="addr" autocomplete="off" ${K(`trips.${i}.from`)} data-after="tripaddr" data-i="${i}" value="${esc(t.from)}" placeholder="Home, Bunnings Kotara…"></label>
      <label class="field"><span>To</span><input type="text" data-sug="addr" autocomplete="off" ${K(`trips.${i}.to`)} data-after="tripaddr" data-i="${i}" value="${esc(t.to)}" placeholder="Site, supplier…"></label></div>
    <div class="fields"><label class="field"><span>Reason</span><input type="text" list="dl_why" ${K(`trips.${i}.why`)} value="${esc(t.why)}" placeholder="e.g. Getting prices on materials"></label>
      <label class="field"><span>Job</span><select ${K(`trips.${i}.jobId`)}>${jobOptions(t.jobId, "General business (no job)")}</select></label></div>
    <div class="row tripkm"><label class="field"><span>Km one way</span><input type="number" inputmode="decimal" step="any" ${K(`trips.${i}.km`)} data-after="tripkm" data-i="${i}" value="${t.km ?? ""}"></label>
      <label class="check"><input type="checkbox" ${K(`trips.${i}.back`)} ${t.back ? "checked" : ""}> Return trip</label>
      <span class="grow"></span>
      ${t.from && t.to ? `<button class="btn sm" data-act="calctrip" data-id="${id}" data-i="${i}">Work out km</button><a class="btn sm ghost" href="${gmapsDir(t.from, t.to)}" target="_blank" rel="noopener">Google Maps</a>` : ""}</div>
    ${num(t.km) ? `<div class="tiny muted">${t.back ? `${num(t.km)} km each way, <b>${round2(num(t.km) * 2)} km</b> in total` : `<b>${num(t.km)} km</b>`}${t.kmAuto ? " (worked out by road)" : ""}</div>` : ""}
  </div>`;
  return `<div class="card"><div class="head"><h2>Driving</h2><span class="hoursbadge">${round2(total)} km</span></div>
    <datalist id="dl_why">${TRIP_WHY.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
    <div class="stack" style="gap:10px">${trips.map(row).join("")}</div>
    ${!trips.length ? `<label class="field" style="max-width:260px"><span>Total km for work today</span><input type="number" inputmode="decimal" step="any" ${K("km")} value="${log.km ?? ""}" placeholder="Or add each trip below"></label>` : ""}
    <div class="row" style="margin-top:10px">${sites.map(x => `<button class="btn sm" data-act="addtrip" data-id="${id}" data-to="${esc(x)}">${ic("plus")} ${s.home ? "Home to " : ""}${esc(shortAddr(x))}${s.home ? " and back" : ""}</button>`).join("")}<button class="btn sm" data-act="addtrip" data-id="${id}">${ic("plus")} Add a trip</button></div>
    <p class="tiny muted" style="margin-bottom:0">For tax time, record each work trip: where from and to, why, and the km. Supplier runs, getting prices and quote visits count too, even when they aren't for one job.${s.home ? "" : ` Add your home or yard address in <a href="#" data-act="nav" data-v="settings">Settings</a> and trips will start from there.`}</p>
  </div>`;
}
async function calcTrip(logId, tripId, quiet){
  const find = () => { const l = getDoc(logId); return [l, l && (l.trips || []).find(x => x.id === tripId)]; };
  let [l, t] = find(); if (!t || !t.from || !t.to) return;
  const from = t.from, to = t.to;
  if (!quiet) toast("Working out the distance…");
  try {
    const km = await drivingKm(from, to);
    [l, t] = find(); if (!t || t.from !== from || t.to !== to) return;
    t.km = km; t.kmAuto = true; put(touch(l)); render(); toast(`${shortAddr(from)} to ${shortAddr(to)}: ${km} km by road${t.back ? ", " + round2(km * 2) + " km there and back" : ""}`);
  } catch(e){ if (!quiet) toast((e && e.message && !/abort|fetch|http/i.test(e.message) ? e.message : "Couldn't work out that distance right now.") + " You can check it in Google Maps and type it in."); }
}

function parseReceipt(text){

  for (const l of tl) { const m = money(l); if (m.length) { total = Math.max(total || 0, ...m); } }
  if (total == null) { const allm = lines.flatMap(money); if (allm.length) total = Math.max(...allm); }

  let date = ""; const dm = text.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/);
  if (dm) { let [_, d, m, y] = dm; y = y.length === 2 ? "20" + y : y; if (+m >= 1 && +m <= 12 && +d >= 1 && +d <= 31) date = `${y}-${pad(m)}-${pad(d)}`; }
  const abnm = text.match(/abn[:\s]*([\d ]{11,14})/i);
  let supplier = SUPPLIERS.find(x => low.includes(x.toLowerCase())) || (lines[0] || "").replace(/[^\w &'-]/g, "").slice(0, 40);
  const cat = /ampol|bp|shell|caltex|7-eleven|metro|united|unleaded|diesel|fuel/i.test(low) ? "Fuel" : /hire|kennards|coates/i.test(low) ? "Equipment hire" : /telstra|optus|vodafone/i.test(low) ? "Phone & internet" : /total tools|sydney tools|drill|saw|makita|milwaukee|dewalt|ryobi/i.test(low) ? "Tools & equipment" : "Materials";
  const items = lines.filter(l => money(l).length && !/total|gst|tax|change|eftpos|visa|mastercard|card|cash|balance|rounding|saving/i.test(l) && /[a-z]{3}/i.test(l)).slice(0, 25).map(l => { const m = money(l); const q = l.match(/^(\d+)\s*[x@]/i); return {desc:l.replace(/\$?\s?\d{1,5}(?:,\d{3})*\.\d{2}/g, "").replace(/^\d+\s*[x@]\s*/i, "").replace(/\s{2,}/g, " ").trim(), qty:q ? +q[1] : 1, amount:m[m.length - 1]}; });
  return {supplier, date, total, gst, abn:abnm ? abnm[1].trim() : "", category:cat, description:"", items, readable:!!(total || items.length)};

  if (what === "km") return [["Date","From","To","Reason","Job","Km one way","Return trip","Km"], ...all("log").filter(l => inFY(l.date, F.fy) && dayKm(l)).sort((a, b) => a.date.localeCompare(b.date)).flatMap(l => (l.trips || []).length
    ? l.trips.filter(t => num(t.km)).map(t => [l.date, t.from, t.to, t.why, jobLabel(getDoc(t.jobId)) || "General business", num(t.km), t.back ? "Yes" : "No", round2(num(t.km) * (t.back ? 2 : 1))])
    : [[l.date, "", "", [(l.entries || []).map(e => e.site).filter(Boolean).join("; "), l.notes].filter(Boolean).join(" | "), "", "", "", num(l.km)]])];
  if (what === "invoices") return [["Invoice","Date","Client","Job","Amount","Status","Paid on","Amount received"], ...all("invoice").filter(i => inFY(i.date, F.fy) || inFY(i.paidDate, F.fy)).sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(i => [i.number, i.date, getDoc(i.clientId)?.name || "", jobLabel(getDoc(i.jobId)), invTotal(i).toFixed(2), invStatus(i), i.paidDate || "", i.status === "paid" ? num(i.paidAmount ?? invTotal(i)).toFixed(2) : ""])];
}
function exportCsv(what){ const F = fySummary(UI.fy); saveFile(`${what === "income" ? "Income" : "Expenses"} FY${fyLabel(UI.fy)}.csv`, toCsv(csvRows(what, F))); }
async function exportTaxPack(){
  if (!window.JSZip) { toast("The zip maker didn't load. Check your connection and try again."); return; }
  const F = fySummary(UI.fy), fy = fyLabel(UI.fy), zip = new JSZip();
  const pdf = await makePdf(taxPaper(F)); if (!pdf) return;
  toast("Packing receipts…");
  zip.file(`Tax summary FY${fy}.pdf`, pdf);
  zip.file(`Income FY${fy}.csv`, toCsv(csvRows("income", F)));
  zip.file(`Expenses FY${fy}.csv`, toCsv(csvRows("expenses", F)));
  zip.file(`Invoices FY${fy}.csv`, toCsv(csvRows("invoices", F)));
  zip.file(`Hours worked FY${fy}.csv`, toCsv(csvRows("hours", F)));
  zip.file(`Driving log FY${fy}.csv`, toCsv(csvRows("km", F)));
  let missing = 0;
  for (const e of F.exps.filter(x => x.receipt)) { const d = await imgGet(e.receipt); if (d) zip.file("Receipts/" + receiptName(e), d.split(",")[1], {base64:true}); else missing++; }
  const blob = await zip.generateAsync({type:"blob"});
  await saveFile(`${bizName()} tax pack FY${fy}.zip`, blob);
  if (missing) toast(`${missing} receipt photo${missing === 1 ? "" : "s"} couldn't be loaded.`);
}
function driveTable(F){
  const logs = all("log").filter(l => inFY(l.date, F.fy) && dayKm(l)).sort((a, b) => a.date.localeCompare(b.date)); if (!logs.length) return "";
  const rows = logs.flatMap(l => (l.trips || []).length ? l.trips.filter(t => num(t.km)).map(t => [l.date, `${esc(t.from || "")} → ${esc(t.to || "")}${t.back ? " and back" : ""}`, esc(t.why || "") + (getDoc(t.jobId) ? `<div style="color:#5b6857;font-size:10px">${esc(jobLabel(getDoc(t.jobId)))}</div>` : ""), num(t.km) * (t.back ? 2 : 1)]) : [[l.date, esc((l.entries || []).map(e => e.site).filter(Boolean).join("; ")), esc(l.notes || ""), num(l.km)]]);
  return `<div class="brk" style="padding-top:18px"><div class="lbl">Business driving log</div></div>
    <table><thead><tr><th style="width:80px">Date</th><th>Trip</th><th style="width:170px">Reason</th><th class="n" style="width:60px">Km</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="brk"><td>${dAU(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td class="n">${round2(r[3])}</td></tr>`).join("")}
      <tr class="brk"><td colspan="3"><b>Total business km</b>${F.V.heavy && F.V.total ? ` <span style="color:#5b6857;font-size:11px">(${Math.round(F.V.total)} km driven in total from odometer)</span>` : ""}</td><td class="n"><b>${Math.round(F.V.bizKm)}</b></td></tr></tbody></table>`;
}
function taxPaper(F){
  const s = S(), fy = fyLabel(F.fy);
  const byClient = {}; F.paidInv.forEach(i => { const n = getDoc(i.clientId)?.name || "Unknown"; byClient[n] = (byClient[n] || 0) + num(i.paidAmount ?? invTotal(i)); });
  const byCat = EXP_CATS.filter(c => !VEH_CATS.includes(c)).map(c => [c, sum(F.exps.filter(e => e.category === c), e => e.amount)]).filter(x => x[1]).concat(F.kmDed ? [[F.V.heavy ? "Vehicle (business share)" : "Car (cents per km)", F.kmDed]] : []);
  const hrs = sum(logEntries().filter(e => inFY(e.date, F.fy)), entryHours);
  const row = (a, b, cls) => `<tr class="brk ${cls || ""}"><td>${a}</td><td class="n">${b}</td></tr>`;
  return `<div class="paper">
    <div class="ph">${logoHtml()}<div class="ttl"><h1 style="font-size:34px">TAX SUMMARY</h1><div class="meta"><span>Financial year</span><b>${fy}</b><span>Period</span><b>1/7/${F.fy} – 30/6/${F.fy + 1}</b><span>Prepared</span><b>${dAU(today())}</b></div></div></div>
    <div class="rule"></div>
    <div class="parties"><div><div class="lbl">Sole trader</div><div class="who">${esc(s.name)}</div>${esc(s.trading)}<br>ABN ${esc(s.abn)}</div><div><div class="lbl">Basis</div>Cash basis: income counted when paid. Not registered for GST, so all amounts include any GST paid.</div></div>
    <table><thead><tr><th>Business result</th><th class="n">Amount</th></tr></thead><tbody>
      ${row("Business income received", money2(F.income))}${row("Business expenses", money2(F.otherExp))}${row(vehLine(F), money2(F.kmDed))}
      ${row("<b>Net business profit</b>", `<b>${money2(F.profit)}</b>`)}${row("Hours worked (from day logs)", fmtH(hrs))}</tbody></table>
    <div class="parties" style="margin-top:18px">
      <div><table><thead><tr><th>Income by client</th><th class="n"></th></tr></thead><tbody>${Object.entries(byClient).sort((a, b) => b[1] - a[1]).map(([n, v]) => row(esc(n), money2(v))).join("") || row("None", "")}${F.other.length ? row("Other income", money2(sum(F.other, x => x.amount))) : ""}</tbody></table></div>
      <div><table><thead><tr><th>Expenses by category</th><th class="n"></th></tr></thead><tbody>${byCat.map(([c, v]) => row(c, money2(v))).join("") || row("None", "")}</tbody></table></div></div>
    <table style="margin-top:6px"><thead><tr><th>Estimate only (check with your accountant)</th><th class="n"></th></tr></thead><tbody>
      ${row("Estimated income tax incl. Medicare levy" + (num(s.withheld) ? ", less tax withheld" : ""), money2(F.taxSetAside))}${row("Put aside for tax", money2(F.putTax))}${row(`Super at ${num(s.superPct)}% of profit`, money2(F.superAmt))}${row("Super contributed (check notice of intent to claim)", money2(F.putSuper))}</tbody></table>
    <div class="pagebreak brk" style="padding-top:10px"><div class="lbl">Income received</div></div>
    <table><thead><tr><th style="width:90px">Paid</th><th style="width:90px">Invoice</th><th>Client</th><th class="n">Amount</th></tr></thead><tbody>
      ${F.paidInv.sort((a, b) => (a.paidDate || "").localeCompare(b.paidDate || "")).map(i => `<tr class="brk"><td>${dAU(i.paidDate)}</td><td>${esc(i.number)}</td><td>${esc(getDoc(i.clientId)?.name || "")}</td><td class="n">${money2(i.paidAmount ?? invTotal(i))}</td></tr>`).join("")}
      ${F.other.map(x => `<tr class="brk"><td>${dAU(x.date)}</td><td></td><td>${esc(x.desc || "Other income")}</td><td class="n">${money2(x.amount)}</td></tr>`).join("")}
      <tr class="brk"><td colspan="3"><b>Total</b></td><td class="n"><b>${money2(F.income)}</b></td></tr></tbody></table>
    <div class="brk" style="padding-top:18px"><div class="lbl">Expenses</div></div>
    <table><thead><tr><th style="width:80px">Date</th><th>Supplier / description</th><th style="width:130px">Category</th><th class="n">Amount</th></tr></thead><tbody>
      ${F.exps.sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(e => `<tr class="brk"><td>${dAU(e.date)}</td><td>${esc(e.supplier || "")}${e.desc ? `<div style="color:#5b6857;font-size:11px">${esc(e.desc)}</div>` : ""}</td><td>${esc(e.category)}</td><td class="n">${money2(e.amount)}${e.receipt ? `<div style="color:#5b6857;font-size:10px">receipt</div>` : ""}${VEH_CATS.includes(e.category) ? `<div style="color:#5b6857;font-size:10px">${F.V.heavy ? "in vehicle costs" : "covered by cents per km"}</div>` : ""}</td></tr>`).join("")}
      <tr class="brk"><td colspan="3"><b>Total business expenses</b>${F.V.vehExp ? ` <span style="color:#5b6857;font-size:11px">(not counting ${money2(F.V.vehExp)} of fuel and vehicle costs, claimed in the vehicle line)</span>` : ""}</td><td class="n"><b>${money2(F.otherExp)}</b></td></tr></tbody></table>
    ${driveTable(F)}
    <div class="terms brk">Prepared from records kept in the job app. Receipt photos are in the Receipts folder of this pack, named by date, supplier and amount. Tax and super figures are estimates for setting money aside, not tax advice.</div>
  </div>`;
}


/* ---------- boot ---------- */
render();
initStore();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { r.addEventListener("updatefound", () => { const w = r.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = 'A new version is ready. <a href="#" style="color:inherit" onclick="location.reload();return false">Reload</a>'; document.body.appendChild(t); } }); }); }).catch(() => {}));</script>
</body></html>
